[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shingan"
version = "0.1.0"
description = "Verified speedups for AI-written GPU kernels"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "httpx>=0.27"]

[project.optional-dependencies]
gpu = ["triton>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
shingan = "shingan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
